<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>闲鱼词典</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="logo">🐟</div>
        <div class="title">
          <div class="title-main">闲鱼词典</div>
          <div class="title-sub" id="title-sub">搜索翻译 / 暗语解读</div>
        </div>
      </header>

      <nav class="tabs">
        <button type="button" class="tab active" data-tab="translate">翻译</button>
        <button type="button" class="tab" data-tab="dict">词典</button>
        <button type="button" class="tab" data-tab="custom">我的</button>
        <button type="button" class="tab" data-tab="about">关于</button>
      </nav>

      <main class="content">
        <!-- 翻译面板 -->
        <section class="panel active" id="panel-translate">
          <div class="input-wrap">
            <textarea
              id="translate-input"
              placeholder="输入正常词查暗语，或粘贴商品标题/描述解读暗语..."
              rows="3"
            ></textarea>
            <button type="button" class="clear-btn" id="clear-btn" title="清空">×</button>
          </div>

          <div class="action-row">
            <button type="button" class="btn btn-primary" id="btn-to-slang">→ 转暗语</button>
            <button type="button" class="btn" id="btn-to-normal">← 解读暗语</button>
          </div>

          <div class="result" id="result-area">
            <div class="empty-state">输入文本后点击上方按钮</div>
          </div>
        </section>

        <!-- 词典面板 -->
        <section class="panel" id="panel-dict">
          <div class="search-wrap">
            <input id="dict-search" type="search" placeholder="搜索词典..." />
          </div>
          <div class="category-chips" id="category-chips"></div>
          <div class="dict-stats" id="dict-stats"></div>
          <div class="dict-list" id="dict-list"></div>
        </section>

        <!-- 我的词典 -->
        <section class="panel" id="panel-custom">
          <div class="custom-form">
            <input type="text" id="custom-normal" placeholder="正常词，如：路由器" />
            <input type="text" id="custom-slangs" placeholder="暗语变体（逗号或空格分隔）" />
            <div class="custom-form-actions">
              <button type="button" class="btn btn-primary" id="btn-custom-add">+ 添加</button>
              <button type="button" class="btn" id="btn-custom-cancel" style="display: none">取消</button>
            </div>
            <div class="custom-form-msg" id="custom-form-msg"></div>
          </div>

          <div class="custom-toolbar">
            <span class="custom-stats" id="custom-stats">0 条</span>
            <div class="custom-toolbar-actions">
              <button type="button" class="btn-mini" id="btn-custom-import" title="从 JSON 导入">📥 导入</button>
              <button type="button" class="btn-mini" id="btn-custom-export" title="导出为 JSON">📤 导出</button>
              <button type="button" class="btn-mini btn-danger" id="btn-custom-clear" title="清空全部">🗑️</button>
            </div>
          </div>
          <input type="file" id="custom-import-file" accept=".json,application/json" style="display: none" />

          <div class="custom-list" id="custom-list"></div>
        </section>

        <!-- 关于 / 设置 -->
        <section class="panel" id="panel-about">
          <div class="version-card">
            <div class="version-row">
              <span class="version-label">词典版本</span>
              <span class="version-value" id="meta-version">-</span>
            </div>
            <div class="version-row">
              <span class="version-label">发布日期</span>
              <span class="version-value" id="meta-updated">-</span>
            </div>
            <div class="version-row">
              <span class="version-label">分类</span>
              <span class="version-value" id="meta-categories">-</span>
            </div>
            <div class="version-row">
              <span class="version-label">词条</span>
              <span class="version-value" id="meta-entries">-</span>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <div class="setting-name">页面暗语高亮</div>
              <div class="setting-desc">在闲鱼页面给已知暗语加下划线提示</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="setting-decode" aria-label="页面暗语高亮开关" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="about">
            <div class="about-title">💡 使用说明</div>
            <ul>
              <li>在闲鱼搜索框输入关键词，自动弹出暗语推荐</li>
              <li>点击推荐词替换搜索框内容</li>
              <li>商品标题/描述里的暗语会标黄，悬停看含义</li>
              <li>词典页可按分类筛选浏览</li>
              <li>插件不发起外部请求，全部本地运行</li>
            </ul>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
