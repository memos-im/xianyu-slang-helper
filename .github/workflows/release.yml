# 发布到 Chrome Web Store
#
# 触发: 推送形如 v1.9.0 的 tag (默认上传为草稿, 不自动提交审核);
#       或手动 workflow_dispatch (可勾选 publish=true 直接提交审核)。
# 一次性配置见 .github/RELEASING.md。
#
# 设计取舍: tag 触发默认只「上传草稿」, 不自动发布——因为词典含擦边词,
# 一个 tag 不应直接把未经人工过目的内容推给所有用户。最后在商店后台点
# 发布 (或手动跑本工作流并勾 publish) 才真正提交审核。

name: Release to Chrome Web Store

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "提交审核 (true) 还是只上传草稿 (false)"
        type: boolean
        default: false

permissions:
  contents: write # 用于把 zip 附到 GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查 + lint + 格式校验
        run: bun run verify

      # 版本唯一来源是 package.json —— 不再有 manifest/source 双写, 只校验 tag 对齐。
      - name: 校验版本一致 (tag == package.json)
        run: |
          PKG_VER=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          echo "package.json=$PKG_VER  ref=$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$PKG_VER" ]; then
              echo "::error::tag ($TAG_VER) 与 package.json ($PKG_VER) 不一致——先 bump 版本再打 tag"; exit 1
            fi
          fi

      - name: 校验 Secrets 已配置
        env:
          EXT: ${{ secrets.CHROME_EXTENSION_ID }}
          CID: ${{ secrets.CHROME_CLIENT_ID }}
          CSECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          missing=""
          [ -z "$EXT" ] && missing="$missing CHROME_EXTENSION_ID"
          [ -z "$CID" ] && missing="$missing CHROME_CLIENT_ID"
          [ -z "$CSECRET" ] && missing="$missing CHROME_CLIENT_SECRET"
          [ -z "$RTOKEN" ] && missing="$missing CHROME_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::缺少 Secrets:$missing —— 配置方法见 .github/RELEASING.md"; exit 1
          fi

      # refresh token 失效是这条流水线最常见的失败原因, 且 chrome-webstore-upload-cli
      # 只会吐一句 "Error: Bad Request" + 一段堆栈, 完全看不出是凭据问题。
      # 这里提前换一次 access token, 把 invalid_grant 变成可执行的错误提示,
      # 顺便省掉后面白跑的构建。
      - name: 预检 refresh token
        env:
          CID: ${{ secrets.CHROME_CLIENT_ID }}
          CSECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          resp=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CID" \
            -d client_secret="$CSECRET" \
            -d refresh_token="$RTOKEN" \
            -d grant_type=refresh_token) || true
          if printf '%s' "$resp" | grep -q '"access_token"'; then
            echo "✓ refresh token 有效"
            exit 0
          fi
          echo "OAuth 响应: $(printf '%s' "$resp" | tr -d '\n')"
          if printf '%s' "$resp" | grep -q 'invalid_grant'; then
            echo "::error::refresh token 已失效 (invalid_grant)。最常见原因: OAuth 应用仍是 Testing 状态——此时 Google 签发的 refresh token 只有 7 天有效期。根治办法: Google Auth Platform → Audience → Publish app, 把状态从 Testing 改成 In production; 再跑 npx -y chrome-webstore-upload-keys 换新 token 并更新 Secret CHROME_REFRESH_TOKEN。详见 .github/RELEASING.md"
          else
            echo "::error::用 refresh token 换 access token 失败, 见上面的 OAuth 响应。配置说明见 .github/RELEASING.md"
          fi
          exit 1

      - name: 构建 + 安全校验 + 打 zip
        run: bun run release:build

      # WXT 把产物放在 dist/, zip 里 manifest.json 已在根目录 (商店要求)。
      - name: 核对产物
        run: |
          ls -la dist
          unzip -l dist/*-chrome.zip | head -20

      # 先存档再上传: 即使商店上传挂了, 也能从 run 页面下载这个 zip 手动传,
      # 不用为了拿包重跑一遍构建。
      - name: 存档 zip (供手动上传兜底)
        uses: actions/upload-artifact@v7
        with:
          name: xianyu-slang-helper-${{ github.ref_name }}
          path: dist/*-chrome.zip
          retention-days: 30

      - name: 上传到 Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          DO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          # 无 command = upload+publish; "upload" = 仅上传草稿。creds 走环境变量。
          if [ "$DO_PUBLISH" = "true" ]; then
            echo "上传并提交审核 (publish)…"
            npx -y chrome-webstore-upload-cli@3 --source dist/*-chrome.zip
          else
            echo "仅上传草稿 (不提交审核, 去后台手动 Publish)…"
            npx -y chrome-webstore-upload-cli@3 upload --source dist/*-chrome.zip
          fi

      - name: 把 zip 附到 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*-chrome.zip
          generate_release_notes: true
