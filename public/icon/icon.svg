<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient (Signature warm Xianyu Yellow-Orange) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE1F" />
      <stop offset="50%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#E84800" />
    </linearGradient>

    <!-- Top gleam highlight -->
    <linearGradient id="topGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Fish main body gradient: pure crisp white -->
    <linearGradient id="fishBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="82%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <!-- Fish tail gradient -->
    <linearGradient id="fishTailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Magnifying rim gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>

    <!-- Magnifier glass lens tint -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#80DEEA" stop-opacity="0.35" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="mainDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#7A1D00" flood-opacity="0.46" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4A1000" flood-opacity="0.2" />
    </filter>

    <filter id="lensDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#A82A00" flood-opacity="0.35" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas (Centered, modern macOS / iOS proportion) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#topGleam)" />
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.25" />

  <!-- Main Hero Graphic (Fish + Decoder Lens) -->
  <g filter="url(#mainDropShadow)">
    
    <!-- Tail Fin: Energetic, balanced fan shape with curved notch -->
    <path d="M 334 256
             L 436 156
             C 442 186, 446 220, 446 256
             C 446 292, 442 326, 436 356
             Z"
          fill="url(#fishTailGrad)" />
    <!-- Tail inner fin crease -->
    <path d="M 344 256 L 436 210 C 440 225, 442 240, 442 256 Z" fill="#D7DFEC" opacity="0.5" />

    <!-- Streamlined Chubby Fish Body -->
    <ellipse cx="236" cy="256" rx="152" ry="118" fill="url(#fishBodyGrad)" />

    <!-- Soft 3D underbelly shade -->
    <path d="M 118 290 
             C 170 354, 304 358, 362 292 
             C 292 334, 174 330, 118 290 Z" 
          fill="#D6DEE9" opacity="0.65" />

    <!-- Big Inquisitive Eye with High-Gloss Highlights -->
    <circle cx="156" cy="226" r="31" fill="#18181B" />
    <circle cx="147" cy="216" r="12.5" fill="#FFFFFF" />
    <circle cx="168" cy="237" r="5.5" fill="#FFFFFF" />
    <circle cx="146" cy="240" r="3" fill="#FFFFFF" />

    <!-- Cheerful Open Smile -->
    <path d="M 118 266 C 130 285, 150 285, 162 268" 
          stroke="#FF5722" stroke-width="7.5" stroke-linecap="round" fill="none" />
    <!-- Cute Pink Tongue / Blush -->
    <ellipse cx="134" cy="285" rx="14" ry="7" fill="#FF7043" opacity="0.32" />

    <!-- Swimming Side Fin -->
    <path d="M 218 274
             C 230 308, 258 318, 276 300
             C 264 286, 244 278, 218 274 Z"
          fill="#E2E8F0" />
    <path d="M 222 278 C 232 298, 248 304, 262 296" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- "Decoder / Dictionary Magnifying Glass" symbol on the Fish Body -->
    <!-- Symbolizing: Decoding slang, searching hidden words, clarifying marketplace code words -->
    <g transform="translate(290, 230)" filter="url(#lensDropShadow)">
      <!-- Magnifier Handle -->
      <path d="M 28 28 L 52 52 C 55 55, 59 55, 62 52 C 65 49, 65 45, 62 42 L 38 18 Z" 
            fill="#E65100" />
      <path d="M 32 24 L 54 46" stroke="#FFA726" stroke-width="3" stroke-linecap="round" />

      <!-- Magnifier Golden/Amber Outer Rim -->
      <circle cx="0" cy="0" r="38" fill="url(#rimGrad)" />
      <!-- Inner cutout -->
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" />
      <!-- Glass Lens with subtle cyan reflection -->
      <circle cx="0" cy="0" r="28" fill="url(#glassGrad)" />

      <!-- Character/Word Symbol inside the decoder lens: Chinese character "词" or Dictionary bookmark -->
      <!-- Let's render a clean, bold "A" or "文" or "词" (slang dictionary symbol) -->
      <!-- A sharp, clean "词" glyph crafted in vector strokes for pixel clarity -->
      <g transform="translate(-16, -16) scale(0.64)">
        <!-- 言字旁 (讠) -->
        <circle cx="10" cy="6" r="3" fill="#D84315" />
        <path d="M 8 16 L 15 14 C 16 14, 16 16, 15 18 L 13 28 C 13 32, 11 34, 7 35" 
              stroke="#D84315" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M 12 40 L 16 35" stroke="#D84315" stroke-width="3.5" stroke-linecap="round" fill="none" />
        <!-- 司 -->
        <!-- 横折 -->
        <path d="M 20 12 L 42 12 C 44 12, 45 14, 45 16 L 45 42 C 45 45, 43 46, 40 45 L 36 44" 
              stroke="#D84315" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <!-- 一 -->
        <line x1="24" y1="23" x2="38" y2="23" stroke="#D84315" stroke-width="3.5" stroke-linecap="round" />
        <!-- 口 -->
        <rect x="23" y="29" width="16" height="13" rx="2" stroke="#D84315" stroke-width="3.5" fill="none" />
      </g>

      <!-- Lens Glint (Curved white reflection) -->
      <path d="M -18 -18 A 25 25 0 0 1 18 -18 A 20 20 0 0 0 -18 -18 Z" fill="#FFFFFF" opacity="0.75" />
    </g>

  </g>

  <!-- Big Sparkle Star (Top Right - Revelation of slang / Eureka moment) -->
  <g transform="translate(412, 90)" filter="url(#starGlow)">
    <path d="M 0 -38 C 2 -12, 12 -2, 38 0 C 12 2, 2 12, 0 38 C -2 12, -12 2, -36 0 C -12 -2, -2 -12, 0 -38 Z" 
          fill="#FFFDE7" />
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Subtle Mini Sparkle (Top Left) -->
  <g transform="translate(86, 120) scale(0.65)">
    <path d="M 0 -28 C 1 -9, 9 -1, 28 0 C 9 1, 1 9, 0 28 C -1 9, -9 1, -28 0 C -9 -1, -1 -9, 0 -28 Z"
          fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
